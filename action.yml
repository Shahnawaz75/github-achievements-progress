name: GitHub Achievements Progress Card
description: Draw an SVG card with your progress toward every GitHub achievement tier and commit it to your profile repository.
author: Shahnawaz75
branding:
  icon: award
  color: green

inputs:
  username:
    description: GitHub username to report on. Defaults to the owner of the repository that runs the workflow.
    required: false
    default: ${{ github.repository_owner }}
  output:
    description: Path of the SVG card to write, relative to the repository root.
    required: false
    default: achievements.svg
  theme:
    description: Theme of the card in `output`, light or dark.
    required: false
    default: light
  dark-output:
    description: Optional path for a second, dark-theme card (for a light/dark <picture> in your README).
    required: false
    default: ""
  token:
    description: >-
      Token for the read-only API calls. The default workflow token only sees public data.
      A personal access token that can read your private repositories gives counts closer to GitHub's.
    required: false
    default: ${{ github.token }}
  commit:
    description: Commit and push the card(s) when they changed ("true" or "false").
    required: false
    default: "true"
  commit-message:
    description: Commit message used when the card changed.
    required: false
    default: "chore: update GitHub achievements card"
  python-version:
    description: Python version used to run the tool.
    required: false
    default: "3.12"

outputs:
  changed:
    description: '"true" when a card changed and was committed.'
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install github-achievements-progress
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    - name: Generate the card
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_DARK_OUTPUT: ${{ inputs.dark-output }}
      run: |
        args=(card "$INPUT_USERNAME" --output "$INPUT_OUTPUT" --theme "$INPUT_THEME")
        mkdir -p "$(dirname "$INPUT_OUTPUT")"
        if [ -n "$INPUT_DARK_OUTPUT" ]; then
          mkdir -p "$(dirname "$INPUT_DARK_OUTPUT")"
          args+=(--dark-output "$INPUT_DARK_OUTPUT")
        fi
        gh-achievements "${args[@]}"

    - name: Commit the card if it changed
      id: commit
      if: inputs.commit == 'true'
      shell: bash
      env:
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_DARK_OUTPUT: ${{ inputs.dark-output }}
        INPUT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        files=("$INPUT_OUTPUT")
        if [ -n "$INPUT_DARK_OUTPUT" ]; then files+=("$INPUT_DARK_OUTPUT"); fi
        git add -- "${files[@]}"
        if git diff --cached --quiet -- "${files[@]}"; then
          echo "Card unchanged, nothing to commit."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "$INPUT_MESSAGE" -- "${files[@]}"
        git push
        echo "changed=true" >> "$GITHUB_OUTPUT"
